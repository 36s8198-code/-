<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>폐교 활용 정책 지원 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>폐교 활용 정책 지원 지도</h1>
    <p>전국 폐교 현황을 지도에서 확인하고, 키워드별 정책 정보를 살펴보세요.</p>
  </header>

  <div id="notice" class="notice" role="status" aria-live="polite"></div>

  <main>
    <section id="map-section">
      <div id="map" aria-label="전국 폐교 지도"></div>
      <p id="map-summary" class="meta"></p>
    </section>

    <aside id="chat" aria-label="정책 도우미">
      <h2>정책 도우미</h2>
      <p class="meta">궁금한 키워드를 선택하세요.</p>
      <div id="keywords" class="keywords"></div>
      <div id="chat-log" class="chat-log" aria-live="polite"></div>
    </aside>
  </main>

  <footer>
    <h3>데이터 출처 및 기준 시점</h3>
    <ul>
      <li>폐교 현황: 공공데이터포털 전국폐교현황표준데이터 (<span id="ref-schools">불러오는 중</span>)</li>
      <li>저출산 통계: 통계청 KOSIS (<span id="ref-kosis">키워드 선택 시 불러옴</span>)</li>
      <li>정책 문구: 팀 제공 자료 (법령 원문은 국가법령정보센터에서 확인 필요)</li>
    </ul>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
